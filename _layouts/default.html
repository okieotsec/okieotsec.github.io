<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Okie<span>OT</span>Sec</a>
      <nav>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/notes/' | relative_url }}">Lab notes</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="mailto:{{ site.email }}">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>
        <a href="{{ site.links.github }}">GitHub</a> ·
        <a href="{{ site.links.youtube }}">YouTube</a> ·
        <a href="{{ site.links.x }}">X</a> ·
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </p>
      <p class="small">Views are my own. Lab content is built on personal equipment and uses fictional environments.</p>
    </div>
  </footer>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  <link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon-180.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#14365C">
  <meta property="og:image" content="{{ '/assets/img/og-card-1200x630.png' | absolute_url }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <picture>
          <source media="(prefers-color-scheme: dark)" srcset="{{ '/assets/img/okieotsec-lockup-dark.svg' | relative_url }}">
          <img src="{{ '/assets/img/okieotsec-lockup.svg' | relative_url }}" alt="OkieOTSec" height="40">
        </picture>
      </a>
      <nav>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a href="{{ '/resources/' | relative_url }}">Resources</a>
        <a href="{{ '/notes/' | relative_url }}">Lab notes</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="mailto:{{ site.email }}">Contact</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p>
        <a href="{{ site.links.github }}">GitHub</a> ·
        <a href="{{ site.links.youtube }}">YouTube</a> ·
        <a href="{{ site.links.x }}">X</a> ·
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
      </p>
      <p class="small">Views are my own. Lab content is built on personal equipment and uses fictional environments.</p>
    </div>
  </footer>
</body>
</html>
